_target_: navsim.agents.ladder_mlp_agent.LadderMLPAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

# override on the command line: agent.run_dir=$NAVSIM_EXP_ROOT/ladder/<run> agent.speed_mode=learned|rule
run_dir: ${oc.env:NAVSIM_EXP_ROOT}/ladder/unset
speed_mode: learned
