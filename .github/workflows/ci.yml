name: ci

# No dataset, no devkit, no GPU: the tests regenerate every report in results/ and
# results/navtest/ from the committed per-scene CSVs (fixed bootstrap seed) and compare
# byte for byte, rebuild pdm_summary.csv, and check the numbers README quotes.

on:
  push:
  pull_request:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: README numbers come from the CSVs (563-scene study)
        run: python analysis/make_summary.py --check README.md
      - name: README numbers come from the CSVs (navtest)
        run: python analysis/analyze_navtest.py --check README.md
      - name: README numbers come from the outputs (failure taxonomy)
        run: python analysis/failure_taxonomy_verify.py readme README.md
      # After the standard-library tests on purpose: numpy only makes the cluster bootstrap fast
      # (the pure-Python path gives the same numbers, much more slowly).
      - name: Failure taxonomy regenerates from the committed features and scores
        run: |
          python -m pip install "numpy==2.2.6"
          python analysis/failure_taxonomy_analyze.py --out "$RUNNER_TEMP/ft"
          mkdir -p "$RUNNER_TEMP/cases"
          cp results/failure_taxonomy/cases/scored_*.jsonl "$RUNNER_TEMP/cases/"
          python analysis/failure_taxonomy_cases.py select --out "$RUNNER_TEMP/cases"
          python analysis/failure_taxonomy_cases.py report --out "$RUNNER_TEMP/cases" --no-plots > /dev/null
          python analysis/failure_taxonomy_verify.py compare "$RUNNER_TEMP/ft" --cases "$RUNNER_TEMP/cases"
